# Keeps the docs dev server and a local bridge running in the background,
# outside the invoking shell or agent. Manage them with the serve:* mise tasks.

# Uses its own socket so it never replaces the installed service's socket
[daemons.bridge]
run = 'HA_BRIDGE_SOCK="$XDG_RUNTIME_DIR/ha-bridge/dev.sock" exec bun run --watch src/index.ts serve'
retry = true

[daemons.docs]
run = 'exec mise run docs:dev --host 127.0.0.1 --port "$PORT"'
port = { expect = [7290], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
retry = true
