min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.2"
pitchfork = "2.30.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run ha-bridge in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile a minified, bytecode-cached ha-bridge binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build @timmo001/effect-ha and @timmo001/effect-ha-bridge into their dist directories"
depends = ["install"]
run = "bun run build:packages"

[tasks."version:sync"]
description = "Pin the client's @timmo001/effect-ha dependency to the shared release version"
run = '''
version="$(bun pm pkg get version | tr -d '"')"
cd packages/client
bun pm pkg set "dependencies.@timmo001/effect-ha=$version"
'''

[tasks.typecheck]
description = "Type-check the source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, and verify formatting"
depends = ["lint", "typecheck", "format:check"]

[tasks."drift:core"]
description = "Compare Home Assistant Core's built-in actions with effect-ha (--update saves the snapshot)"
depends = ["install"]
run = "bun scripts/check-core-drift.ts"

[tasks."docs:gen"]
description = "Regenerate the docs command reference from the CLI's help"
depends = ["install"]
run = "bun scripts/generate-cli-reference.ts"

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:bridge"]
description = "Start a local bridge in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start bridge"

[tasks."serve:bridge:status"]
description = "Show the background local bridge status"
run = "pitchfork status bridge"

[tasks."serve:bridge:logs"]
description = "Follow the background local bridge logs"
run = "pitchfork logs -t bridge"

[tasks."serve:bridge:restart"]
description = "Restart the background local bridge"
run = "pitchfork restart bridge"

[tasks."serve:bridge:stop"]
description = "Stop the background local bridge"
run = "pitchfork stop bridge"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"
