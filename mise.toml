min_version = "2025.1.0"

[tools]
node = "26.10.0"
bun = "1.4.2"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run ha-bridge in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile the ha-bridge binary"
depends = ["install"]
run = "bun run build"

[tasks."build:packages"]
description = "Build @timmo001/effect-ha and @timmo001/effect-ha-bridge into their dist directories"
depends = ["install"]
run = "bun run build:packages"

[tasks."version:sync"]
description = "Pin the client's @timmo001/effect-ha dependency to the shared release version"
run = '''
version="$(bun pm pkg get version | tr -d '"')"
cd packages/client
bun pm pkg set "dependencies.@timmo001/effect-ha=$version"
'''

[tasks.typecheck]
description = "Type-check the source"
depends = ["install"]
run = "bun run typecheck"

[tasks.test]
description = "Run tests"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Lint source with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check, and verify formatting"
depends = ["lint", "typecheck", "format:check"]
