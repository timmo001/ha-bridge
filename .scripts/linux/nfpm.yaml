---
name: ha-bridge
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: Aidan Timson <aidan@timmo.dev>
description: One shared Home Assistant connection for your machine, served to local apps over a single socket
homepage: https://github.com/timmo001/ha-bridge
license: Apache-2.0
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
contents:
  - src: dist/release/root/ha-bridge
    dst: /usr/bin/ha-bridge
    file_info:
      mode: 0755
  - src: .scripts/linux/ha-bridge.service
    dst: /usr/lib/systemd/user/ha-bridge.service
  - src: .scripts/linux/completions/ha-bridge.bash
    dst: /usr/share/bash-completion/completions/ha-bridge
  - src: .scripts/linux/completions/ha-bridge.fish
    dst: /usr/share/fish/vendor_completions.d/ha-bridge.fish
  - src: .scripts/linux/completions/_ha-bridge
    dst: /usr/share/zsh/site-functions/_ha-bridge
  - src: LICENSE
    dst: /usr/share/licenses/ha-bridge/LICENSE
