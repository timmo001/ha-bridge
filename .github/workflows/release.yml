---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tools:
    name: Resolve release tools
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.versions.outputs.bun }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Read tool versions
        id: versions
        run: |
          printf 'bun=%s\n' "$(mise current bun)" >> "$GITHUB_OUTPUT"
          printf 'node=%s\n' "$(mise current node)" >> "$GITHUB_OUTPUT"

  effect-ha-npm:
    name: effect-ha npm
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/effect-ha
      check-command: cd ../.. && bun run --parallel --no-exit-on-error check test

  effect-ha-jsr:
    name: effect-ha JSR
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/effect-ha
      check-command: (cd ../.. && bun run --parallel --no-exit-on-error check test) && bun run build

  # The client pins @timmo001/effect-ha to this release, so publish it once effect-ha is out.
  client-npm:
    name: effect-ha-bridge npm
    needs:
      - tools
      - effect-ha-npm
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/client
      check-command: cd ../.. && bun run --parallel --no-exit-on-error check test

  client-jsr:
    name: effect-ha-bridge JSR
    needs:
      - tools
      - effect-ha-jsr
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/client
      # The JSR entry resolves @timmo001/effect-ha from the workspace, so build it too.
      check-command: cd ../.. && bun run --parallel --no-exit-on-error check test build:packages

  linux:
    name: Linux
    needs: tools
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      binary-name: ha-bridge
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: ${{ needs.tools.outputs.bun }}
      smoke-test-arguments: |-
        --version
        --help
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        ./dist/release/root/ha-bridge --completions bash > .scripts/linux/completions/ha-bridge.bash
        ./dist/release/root/ha-bridge --completions fish > .scripts/linux/completions/ha-bridge.fish
        ./dist/release/root/ha-bridge --completions zsh > .scripts/linux/completions/_ha-bridge
      release-version: ${{ github.event.release.tag_name }}
      source-ref: ${{ github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (ha-bridge-bin)
    needs: linux
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: ha-bridge
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "--completions {shell}"
          extraFiles: |-
            LICENSE
            .scripts/linux/ha-bridge.service
            .scripts/linux/ha-bridge.install

      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-ha-bridge-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (ha-bridge-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      package-name: ha-bridge-bin
      package-files-artifact-name: arch-ha-bridge-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (ha-bridge-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@942a2e735c957787562e621d916fb6f78c9bb508 # 20261009.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: ${{ github.event.release.tag_name }}
      package-name: ha-bridge-bin
