---
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - mise.toml
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .scripts/linux/ha-bridge.install
      - .scripts/linux/ha-bridge.service
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (ha-bridge-git)
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
    with:
      package-name: ha-bridge-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
